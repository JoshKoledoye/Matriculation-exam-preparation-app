<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro~Wave Sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="prowave.css">
</head>

<body>
<div class="app" id="app" data-collapsed="false" data-drawer="closed">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar" aria-label="Main menu">

    <!-- Profile banner -->
    <div class="profile">
      <svg class="facets" viewBox="0 0 280 178" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <polygon points="0,0 120,0 60,70"        fill="#fff" fill-opacity=".07"/>
        <polygon points="120,0 280,0 210,80"     fill="#2563eb" fill-opacity=".35"/>
        <polygon points="0,0 60,70 0,120"        fill="#2b1068" fill-opacity=".30"/>
        <polygon points="60,70 120,0 210,80"     fill="#fff" fill-opacity=".10"/>
        <polygon points="60,70 210,80 130,178"   fill="#5b21b6" fill-opacity=".40"/>
        <polygon points="0,120 60,70 130,178 0,178" fill="#2563eb" fill-opacity=".25"/>
        <polygon points="210,80 280,0 280,110"   fill="#fff" fill-opacity=".12"/>
        <polygon points="210,80 280,110 280,178 130,178" fill="#2b1068" fill-opacity=".28"/>
        <polygon points="150,178 230,120 280,178" fill="#3b82f6" fill-opacity=".35"/>
      </svg>

      <div class="avatar">
        <svg viewBox="0 0 100 100" role="img" aria-label="Profile picture">
          <defs>
            <clipPath id="ring"><circle cx="50" cy="50" r="45"/></clipPath>
            <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#60a5fa"/>
              <stop offset="1" stop-color="#2563eb"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="50" fill="#fff"/>
          <g clip-path="url(#ring)" fill="url(#person)">
            <circle cx="50" cy="38" r="17"/>
            <ellipse cx="50" cy="90" rx="32" ry="28"/>
          </g>
        </svg>
      </div>

      <div class="identity">
        <span class="username">Israel</span>
        <button class="edit" type="button" aria-label="Edit profile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
      </div>
    </div>

    <!-- Menu -->
    <nav class="nav">

      <div class="group">
        <h2 class="group-title">History</h2>

        <a class="item" href="#result-history" data-label="Result History" aria-current="page">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg>
          <span class="label">Result History</span>
        </a>

        <a class="item" href="#bookmarks" data-label="Bookmarks">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15-5-2.18L7 18V5h10v13z"/></svg>
          <span class="label">Bookmarks</span>
        </a>
      </div>

      <div class="group">
        <h2 class="group-title">Contact</h2>

        <a class="item" href="#feedback" data-label="Feedback">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
          <span class="label">Feedback</span>
        </a>

        <a class="item" href="#share" data-label="Share">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
          <span class="label">Share</span>
        </a>

        <a class="item" href="#about" data-label="About Pro~Wave">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
          <span class="label">About Pro~Wave</span>
        </a>
      </div>

    </nav>
  </aside>

  <div class="scrim" id="scrim"></div>

  <!-- ================= MAIN CONTENT (demo) ================= -->
  <div class="main">
    <header class="topbar">
      <button class="toggle" id="toggle" type="button"
              aria-controls="sidebar" aria-expanded="true" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <span class="brand">Pro<span>~</span>Wave</span>
    </header>

    <main class="content">
      
  <div class="container">

    <header class="profile-header">
       <div class="user-info">
        <div class="profile-pic"> 
          
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <h1 class="username">Hello <span class="highlight">Username</span></h1>
      </div>
    </header>

    <section class="grid-container">
      <div class="grid-card"><img class="images" src="pics/simulation.jpeg" alt="JAMB Simulation"></div>
      <div class="grid-card"><img class="images" src="pics/practice.jpeg" alt="Step by Step Practice"></div>
      <div class="grid-card"><img class="images" src="pics/text book.jpeg" alt="Textbook"></div>
      <div class="grid-card"><img class="images" src="pics/Class room.jpeg" alt="Class Room"></div>
      <div class="grid-card"><img class="images" src="pics/discipline mode.jpeg" alt="Discipline Mode"></div>
      <div class="grid-card"><img class="images" src="pics/analysis.jpeg" alt="Performance Analysis"></div>
    </section>

  </div>
</main>
    
  </div>

</div>

<script src="prowave.js"></script>
</body>
</html>
