<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProWave JAMB Prep - Dashboard</title>
  <link rel="stylesheet" href="prowave.css">
</head>
<body>

  <div class="container">
    
    <!-- User Profile Header -->
    <header class="profile-header">
      <div class="user-info">
        <div class="profile-pic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <h1 class="username">Hello <span class="highlight">Username</span></h1>
      </div>
    </header>

    <!-- 6-Grid System -->
    <main class="grid-container">
      <div class="grid-card">
        <h2>Card 1</h2>
      </div>

      <div class="grid-card">
        <h2>Card 2</h2>
      </div>

      <div class="grid-card">
        <h2>Card 3</h2>
      </div>

      <div class="grid-card">
        <h2>Card 4</h2>
      </div>

      <div class="grid-card">
        <h2>Card 5</h2>
      </div>

      <div class="grid-card">
        <h2>Card 6</h2>
      </div>
    </main>

  </div>

</body>
</html>
